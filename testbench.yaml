laravel: '@testbench'

providers:
  - Made\CmsPackage\CmsPackageServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

env:
  - APP_NAME="Made CMS Workbench"
  - MADE_CMS_LAUNCHER_IPS=127.0.0.1,::1
  # A login must survive between requests, and the login code ends up in the log.
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  - MAIL_MAILER=log

migrations:
  - database/migrations
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
